<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পড়ার সাথী – গণিত ও ইংরেজি সমাধান</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#1d2433; --muted:#667085; --line:#e4e7ee;
  --brand:#2f5bea; --brand-ink:#ffffff; --brand-soft:#e8edff;
  --ok:#0f8a5f; --ok-soft:#e3f6ee; --warn:#b54708; --warn-soft:#fff1e0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10131a; --card:#181c26; --ink:#e8ebf2; --muted:#98a2b3; --line:#2a3040;
    --brand:#6c8cff; --brand-ink:#0b1020; --brand-soft:#1e2745;
    --ok:#4cd6a0; --ok-soft:#15302a; --warn:#ffb067; --warn-soft:#33261a;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.7; font-size:17px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;padding:12px 0 18px}
header h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.2px}
header p{margin:6px 0 0;color:var(--muted);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1 1 140px;min-width:0}
label.lbl{display:block;font-size:14px;color:var(--muted);margin:0 0 4px;font-weight:500}
select,textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;
}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{resize:vertical;min-height:120px;margin-top:12px;font-size:17px}
select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button:hover{border-color:var(--brand)}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600;flex:1 1 auto;padding:12px 18px;font-size:18px}
button.primary:disabled{opacity:.6;cursor:default}
button.ghost{background:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand);border:none}
.thumb{display:none;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--muted)}
.thumb img{height:56px;border-radius:8px;border:1px solid var(--line)}
.thumb.show{display:flex}
#out{margin-top:18px;display:none}
#out.show{display:block}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;color:var(--muted);font-size:14px}
.answer h2{font-size:19px;margin:20px 0 6px;padding:6px 12px;border-radius:10px;background:var(--brand-soft);color:var(--brand)}
.answer h2:first-child{margin-top:0}
.answer h3{font-size:17px;margin:14px 0 4px}
.answer p{margin:8px 0}
.answer ul,.answer ol{margin:8px 0;padding-left:24px}
.answer li{margin:4px 0}
.answer pre{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;margin:10px 0;font-size:16px;line-height:1.8;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;white-space:pre-wrap}
.answer code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.answer pre code{border:0;padding:0;background:none}
.answer blockquote{margin:10px 0;padding:10px 14px;border-left:4px solid var(--ok);background:var(--ok-soft);border-radius:0 10px 10px 0}
.answer hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.cursor{display:inline-block;width:8px;height:18px;background:var(--brand);vertical-align:-3px;animation:b 1s steps(2) infinite;margin-left:2px}
@keyframes b{50%{opacity:0}}
.msg{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);display:none}
.msg.show{display:block}
footer{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📘 পড়ার সাথী</h1>
    <p>যেকোনো ক্লাসের গণিত বা ইংরেজি প্রশ্ন দাও — ধাপে ধাপে বুঝিয়ে উত্তর পাবে</p>
  </header>

  <div class="card">
    <div class="row">
      <div class="field">
        <label class="lbl" for="cls">ক্লাস / স্তর</label>
        <select id="cls">
          <option>ক্লাস ১</option><option>ক্লাস ২</option><option>ক্লাস ৩</option>
          <option>ক্লাস ৪</option><option>ক্লাস ৫</option><option>ক্লাস ৬</option>
          <option>ক্লাস ৭</option><option selected>ক্লাস ৮</option><option>ক্লাস ৯</option>
          <option>ক্লাস ১০</option><option>একাদশ-দ্বাদশ (HSC)</option><option>অনার্স / বিশ্ববিদ্যালয়</option>
        </select>
      </div>
      <div class="field">
        <label class="lbl" for="sub">বিষয়</label>
        <select id="sub">
          <option value="auto">নিজে বুঝে নাও</option>
          <option value="math">গণিত</option>
          <option value="english">ইংরেজি</option>
        </select>
      </div>
      <div class="field">
        <label class="lbl" for="lang">ব্যাখ্যার ভাষা</label>
        <select id="lang">
          <option value="bn">বাংলা</option>
          <option value="en">English</option>
          <option value="mix">বাংলা + English</option>
        </select>
      </div>
    </div>

    <textarea id="q" placeholder="এখানে প্রশ্ন লিখো। যেমন: x² − 5x + 6 = 0 সমাধান করো&#10;অথবা: Change into passive voice: She writes a letter."></textarea>

    <div class="thumb" id="thumb"><img id="thumbImg" alt=""><span id="thumbName"></span><button class="ghost" id="rmImg" type="button">সরাও</button></div>

    <div class="tools">
      <button id="photoBtn" type="button" style="display:none">📷 ছবি দাও</button>
      <input type="file" id="file" accept="image/*" hidden>
      <button class="primary" id="go" type="button">উত্তর দেখাও</button>
      <button id="stop" type="button" style="display:none">থামাও</button>
    </div>

    <div class="chips" id="chips"></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="out">
    <div class="bar"><span id="status"></span><button class="ghost" id="copy" type="button">কপি</button></div>
    <div class="answer" id="ans"></div>
  </div>

  <footer>AI ভুল করতে পারে — গুরুত্বপূর্ণ উত্তর শিক্ষক বা বইয়ের সাথে মিলিয়ে নাও।</footer>
</div>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var examples = [
    "2x + 5 = 17 হলে x এর মান কত?",
    "একটি আয়তক্ষেত্রের দৈর্ঘ্য ১২ সেমি ও প্রস্থ ৮ সেমি। এর কর্ণ কত?",
    "x² − 5x + 6 = 0 সমাধান করো",
    "Change into passive: She writes a letter every day.",
    "Fill in the blank: He ___ (go) to school yesterday.",
    "Write a paragraph on 'Digital Bangladesh'."
  ];
  var chips = $("chips");
  examples.forEach(function(t){
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = t;
    b.onclick = function(){ $("q").value = t; $("q").focus(); };
    chips.appendChild(b);
  });

  /* ---------- tiny markdown renderer ---------- */
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
    return s;
  }
  function render(md){
    var lines = md.replace(/\r/g,"").split("\n"), html = "", i = 0, list = null, para = [];
    function flushP(){ if(para.length){ html += "<p>"+inline(para.join(" "))+"</p>"; para = []; } }
    function closeList(){ if(list){ html += "</"+list+">"; list = null; } }
    while(i < lines.length){
      var l = lines[i];
      if(/^```/.test(l)){
        flushP(); closeList();
        var buf = []; i++;
        while(i < lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
        html += "<pre><code>"+esc(buf.join("\n"))+"</code></pre>"; i++; continue;
      }
      var m;
      if((m = l.match(/^(#{1,3})\s+(.*)$/))){
        flushP(); closeList();
        var tag = m[1].length === 1 ? "h2" : (m[1].length === 2 ? "h2" : "h3");
        html += "<"+tag+">"+inline(m[2])+"</"+tag+">";
      } else if((m = l.match(/^\s*[-*•]\s+(.*)$/))){
        flushP(); if(list !== "ul"){ closeList(); html += "<ul>"; list = "ul"; }
        html += "<li>"+inline(m[1])+"</li>";
      } else if((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){
        flushP(); if(list !== "ol"){ closeList(); html += "<ol>"; list = "ol"; }
        html += "<li>"+inline(m[1])+"</li>";
      } else if((m = l.match(/^>\s?(.*)$/))){
        flushP(); closeList(); html += "<blockquote>"+inline(m[1])+"</blockquote>";
      } else if(/^\s*---+\s*$/.test(l)){
        flushP(); closeList(); html += "<hr>";
      } else if(/^\s*$/.test(l)){
        flushP(); closeList();
      } else {
        closeList(); para.push(l.trim());
      }
      i++;
    }
    flushP(); closeList();
    return html;
  }

  /* ---------- state ---------- */
  var imgBlob = null, ctrl = null, lastText = "";
  var msg = $("msg");
  function showMsg(t){ msg.textContent = t; msg.classList.toggle("show", !!t); }

  // ছবি দেওয়ার বোতাম চালু
  $("photoBtn").style.display = "";

  /* ---------- image ---------- */
  $("photoBtn").onclick = function(){ $("file").click(); };
  $("file").onchange = function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    if(f.size > 3 * 1024 * 1024){ showMsg("ছবিটা ৩ MB-এর বেশি বড়। ছোট ছবি দাও।"); e.target.value = ""; return; }
    showMsg("");
    imgBlob = f;
    $("thumbImg").src = URL.createObjectURL(f);
    $("thumbName").textContent = f.name;
    $("thumb").classList.add("show");
  };
  $("rmImg").onclick = function(){
    imgBlob = null; $("file").value = ""; $("thumb").classList.remove("show");
  };

  /* ---------- prompt ---------- */
  function buildPrompt(q){
    var cls = $("cls").value, sub = $("sub").value, lang = $("lang").value;
    var subTxt = sub === "math" ? "গণিত" : sub === "english" ? "ইংরেজি" : "গণিত অথবা ইংরেজি (প্রশ্ন দেখে নিজে ঠিক করো)";
    var langTxt = lang === "bn" ? "সহজ বাংলায় ব্যাখ্যা করো (ইংরেজি শব্দ/বাক্য উদাহরণে যেমন আছে তেমনই রাখো)."
      : lang === "en" ? "Explain in simple English."
      : "বাংলা ও ইংরেজি মিশিয়ে ব্যাখ্যা করো; মূল পরিভাষা দুই ভাষাতেই লেখো.";
    return [
      "তুমি বাংলাদেশের একজন অভিজ্ঞ, ধৈর্যশীল শিক্ষক। শিক্ষার্থীর স্তর: " + cls + "। বিষয়: " + subTxt + "।",
      langTxt,
      "",
      "নিয়ম:",
      "- ক্লাসের স্তর অনুযায়ী ভাষা ও পদ্ধতি বেছে নাও (ছোট ক্লাসে খুব সহজ উদাহরণ, বড় ক্লাসে সূত্রসহ যুক্তি)।",
      "- কোনো ধাপ বাদ দেবে না। প্রতিটি ধাপে কী করছ এবং কেন করছ তা এক লাইনে বলো।",
      "- গাণিতিক লেখা সাধারণ টেক্সটে লেখো (যেমন x², √25, ½, ×, ÷, ≠, π)। LaTeX বা $ চিহ্ন ব্যবহার করবে না। হিসাবের ধাপগুলো ``` ব্লকের ভেতরে লাইন ধরে লেখো।",
      "- ইংরেজি হলে (grammar, translation, paragraph, composition, comprehension ইত্যাদি) নিয়মটি আগে বুঝিয়ে তারপর উত্তর দাও, এবং ১-২টি অতিরিক্ত উদাহরণ দাও।",
      "- টেবিল ব্যবহার করবে না। শুধু ## শিরোনাম, তালিকা, **বোল্ড** আর ``` ব্লক ব্যবহার করো।",
      "- প্রশ্ন অস্পষ্ট বা অসম্পূর্ণ হলে কী ধরে নিলে তা আগে বলো।",
      "- প্রশ্ন গণিত বা ইংরেজির বাইরে হলে বিনয়ের সাথে জানাও যে এই অ্যাপ শুধু গণিত ও ইংরেজির জন্য।",
      "",
      "উত্তরের কাঠামো (এই শিরোনামগুলোই ব্যবহার করো):",
      "## 🧐 প্রশ্নটা কী চাইছে",
      "## 🪜 ধাপে ধাপে সমাধান",
      "## ✅ চূড়ান্ত উত্তর  (এখানে উত্তরটা > দিয়ে একটি ব্লককোটে লেখো)",
      "## 🔍 মিলিয়ে দেখো  (গণিতে উত্তর যাচাই; ইংরেজিতে নিয়ম মিলিয়ে দেখা)",
      "## 💡 মনে রাখার টিপস  (সূত্র/নিয়ম এবং সাধারণ ভুল)",
      "## ✏️ নিজে করো  (একই ধরনের একটি নতুন প্রশ্ন, উত্তর ছাড়া)",
      "",
      "শিক্ষার্থীর প্রশ্ন:",
      q || "(ছবিতে দেওয়া প্রশ্নটি দেখো)"
    ].join("\n");
  }

  function toBase64(blob){
    return new Promise(function(ok, bad){
      var r = new FileReader();
      r.onload = function(){ ok(String(r.result).split(",")[1]); };
      r.onerror = bad; r.readAsDataURL(blob);
    });
  }

  /* ---------- run ---------- */
  function setBusy(b){
    $("go").disabled = b; $("stop").style.display = b ? "" : "none";
    $("go").textContent = b ? "ভাবছি…" : "উত্তর দেখাও";
  }
  function show(text, streaming){
    $("out").classList.add("show");
    $("ans").innerHTML = render(text) + (streaming ? '<span class="cursor"></span>' : "");
  }

  $("go").onclick = async function(){
    var q = $("q").value.trim();
    showMsg("");
    if(!q && !imgBlob){ showMsg("আগে একটা প্রশ্ন লিখো বা ছবি দাও।"); return; }
    ctrl = new AbortController();
    setBusy(true); lastText = "";
    $("status").textContent = "সমাধান লেখা হচ্ছে…";
    $("out").classList.add("show");
    $("ans").innerHTML = '<span class="cursor"></span>';
    $("out").scrollIntoView({behavior:"smooth",block:"start"});
    try{
      var body = { prompt: buildPrompt(q) };
      if(imgBlob){ body.image = await toBase64(imgBlob); body.mediaType = imgBlob.type || "image/jpeg"; }
      var res = await fetch("/api/solve", {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify(body), signal: ctrl.signal
      });
      var data = await res.json().catch(function(){ return {}; });
      if(!res.ok){ var err = new Error(data.error || "error"); err.code = res.status === 429 ? "rate_limited" : "fail"; throw err; }
      lastText = data.text; show(data.text, false);
      $("status").textContent = "সম্পূর্ণ ✔";
    }catch(e){
      if(lastText){ show(lastText, false); }
      var code = e && e.code;
      if(code === "rate_limited") showMsg("একটু বেশি অনুরোধ হয়ে গেছে। কিছুক্ষণ পর আবার চেষ্টা করো।");
      else if(e && e.name === "AbortError") $("status").textContent = "থামানো হয়েছে";
      else showMsg("কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করো।");
      if(!lastText) $("out").classList.remove("show");
    }finally{
      setBusy(false); ctrl = null;
    }
  };
  $("stop").onclick = function(){ if(ctrl) ctrl.abort(); };

  $("copy").onclick = async function(){
    try{ await navigator.clipboard.writeText(lastText); $("copy").textContent = "কপি হয়েছে ✔"; }
    catch(e){ $("copy").textContent = "কপি যায়নি"; }
    setTimeout(function(){ $("copy").textContent = "কপি"; }, 1800);
  };
})();
</script>
</body>
</html>
